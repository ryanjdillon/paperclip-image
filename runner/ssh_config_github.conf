# git over SSH to GitHub through port 443 (ssh.github.com): the runner's
# egress allows HTTPS only. In a run, the connection goes through the egress
# proxy as a CONNECT tunnel (ssh-proxy-connect, DIL-888). The key is a
# per-repository deploy key mounted by the deployment; GitHub's host keys are
# pinned in the image (github_known_hosts, from api.github.com/meta), so a
# key change fails closed.
# ServerAliveInterval: ssh-proxy-connect's netcat closes a connection that
# is idle for 15 s (-w 15), so ssh sends a keepalive after 10 s of silence
# from the server, and gives up after 3 unanswered ones.
Host github.com
  HostName ssh.github.com
  Port 443
  User git
  HostKeyAlias github.com
  IdentityFile /run/secrets/git/skrap/key
  IdentitiesOnly yes
  UserKnownHostsFile /etc/ssh/github_known_hosts
  GlobalKnownHostsFile /dev/null
  StrictHostKeyChecking yes
  UpdateHostKeys no
  ProxyCommand /usr/local/bin/ssh-proxy-connect %h %p
  ServerAliveInterval 10
  ServerAliveCountMax 3
