# git over SSH to GitHub through port 443 (ssh.github.com): the runner's
# egress allows HTTPS only. The key is a per-repository deploy key mounted by
# the deployment; GitHub's host keys are pinned in the image
# (github_known_hosts, from api.github.com/meta), so a key change fails closed.
Host github.com
  HostName ssh.github.com
  Port 443
  User git
  HostKeyAlias github.com
  IdentityFile /run/secrets/git/skrap/key
  IdentitiesOnly yes
  UserKnownHostsFile /etc/ssh/github_known_hosts
  GlobalKnownHostsFile /dev/null
  StrictHostKeyChecking yes
  UpdateHostKeys no
