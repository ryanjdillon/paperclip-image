# Single-user Nix for the agent runner (DIL-889). The store is the runner's
# /nix volume, owned by the agent user; there is no daemon and no root.
#
# These are the defaults every run gets, not a boundary: in single-user mode
# the store's owner is trusted, so a run can pass --option itself. What holds
# is that a run cannot change them for the next one (this file is in the
# read-only image, and ~/.config/nix is reset at every start).

experimental-features = nix-command flakes

# The real /nix/store. The static binary's default ("auto") falls back to a
# chroot store under ~/.local/share/nix when /nix/store does not exist yet,
# whose builders cannot run outside a namespace.
store = local

# cache.nixos.org only, and only signed paths.
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
require-sigs = true
# A flake's nixConfig cannot add substituters or keys.
accept-flake-config = false

# No build sandbox: it needs user namespaces, which the pod's RuntimeDefault
# seccomp profile refuses (unshare(CLONE_NEWUSER) is EPERM). Builds run as the
# agent user with the run's own network and rights, which is no more than the
# run already has; nearly everything comes from the cache instead.
sandbox = false
build-users-group =

# Debian's CA bundle (the static binary's compiled-in path is a store path
# that does not exist here).
ssl-cert-file = /etc/ssl/certs/ca-certificates.crt

# Profiles and channels live under ~/.local/state/nix rather than as dotfiles.
use-xdg-base-directories = true
# The pod's CPU limit.
cores = 4
max-jobs = 2
connect-timeout = 10
warn-dirty = false
