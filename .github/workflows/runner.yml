name: runner

on:
  push:
    branches: [main]
    paths:
      - runner/**
      - .github/workflows/runner.yml
  pull_request:
    paths:
      - runner/**
      - .github/workflows/runner.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the older run of that PR. A main run that has
# started is not cancelled. Main runs run one at a time, so an older build
# cannot push its image tags after a newer build. A newer main run replaces
# a main run that waits in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    # The called job declares packages: write and cannot exceed this grant,
    # even when it only builds; registry login is skipped unless pushing.
    permissions:
      contents: read
      packages: write
    uses: ryanjdillon/workflows/.github/workflows/docker-build-push.yml@f7aa26b3ffb54bb032d2710a44296ec3b82a3f7e # v1.0.0
    with:
      image: ryanjdillon/paperclip-agent-runner
      context: runner
      platforms: linux/amd64
      # Only main publishes; pull requests and other branches only build.
      push: ${{ github.ref == 'refs/heads/main' }}
