name: sandbox-ssh

on:
  push:
    branches: [main]
    paths:
      - sandbox-ssh/**
      - .github/workflows/sandbox-ssh.yml
  pull_request:
    paths:
      - sandbox-ssh/**
      - .github/workflows/sandbox-ssh.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the older run of that PR. A main run that has
# started is not cancelled. Main runs run one at a time, so an older build
# cannot push its image tags after a newer build. A newer main run replaces
# a main run that waits in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox-ssh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm version named in package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sandbox-ssh/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sandbox-ssh/pnpm-lock.yaml
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - run: just check
      - run: just build

  image:
    needs: check
    # The called job declares packages: write and cannot exceed this grant,
    # even when it only builds; registry login is skipped unless pushing.
    permissions:
      contents: read
      packages: write
    uses: ryanjdillon/workflows/.github/workflows/docker-build-push.yml@ebb73dbf81f54d7bf8ddb23e5b8e0783e7926acd # v1.2.2
    with:
      image: ryanjdillon/paperclip-sandbox-ssh
      context: sandbox-ssh
      # The server image is built for both; the files are the same on each.
      platforms: linux/amd64,linux/arm64
      # Only main publishes; pull requests and other branches only build.
      push: ${{ github.ref == 'refs/heads/main' }}
